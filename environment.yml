# environment.yml
name: cap-pipeline
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Core R and R packages
  # Pinning to 4.4.* allows patch updates (e.g. 4.4.4) which maintains binary compatibility
  # but allows for security/bug fixes and easier dependency resolution.
  - r-base=4.4
  - r-seqinr
  - r-stringr
  - r-stringdist
  - r-scales
  - r-ape
  - r-doparallel
  - r-getopt
  - r-renv
  - bioconductor-biostrings
  - bioconductor-genomicranges
  - bioconductor-iranges
  - bioconductor-msa
  
  # Python and data science
  - python=3.11
  - pandas
  - numpy
  - joblib
  - xgboost=3.0.5
  - scikit-learn=1.7.2
  
  # Bioinformatics tools
  - mafft
  - hmmer
  
  # Version control and workflow
  - git
  - nextflow
  - openjdk=17  # Pin Java to LTS version to avoid compatibility issues with Nextflow/LevelDB on newer Java versions

  # Build and compilation tools for R packages
  - cmake
  - make
  - c-compiler
  - cxx-compiler
  # Build against an older Linux userspace so ctw-calc runs on glibc 2.28+
  # systems as well as newer distributions.
  - sysroot_linux-64=2.28
  - kernel-headers_linux-64=4.18
  - gsl
  - libblas
  - liblapack
  
  # Additional utilities
  - glpk